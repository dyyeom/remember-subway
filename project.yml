name: RememberSubway
options:
  bundleIdPrefix: kr.co.remembersubway
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    DEVELOPMENT_TEAM: ""
targets:
  RememberSubway:
    type: application
    platform: iOS
    sources:
      - path: RememberSubway
        excludes:
          - Resources/Assets.xcassets
    resources:
      - path: RememberSubway/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.co.remembersubway.app
        PRODUCT_NAME: "역순서"
        PRODUCT_MODULE_NAME: RememberSubway
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: "역순서"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: RememberSubway/RememberSubway.entitlements
      properties:
        com.apple.developer.game-center: true
  RememberSubwayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - RememberSubwayTests
    dependencies:
      - target: RememberSubway
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: kr.co.remembersubway.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/역순서.app/역순서"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  RememberSubway:
    build:
      targets:
        RememberSubway: all
        RememberSubwayTests: [test]
    test:
      targets:
        - RememberSubwayTests
