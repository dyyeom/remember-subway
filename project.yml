name: RememberSubway
options:
  bundleIdPrefix: com.evolvingark.remembersubway
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "11"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    DEVELOPMENT_TEAM: ""
targets:
  RememberSubway:
    type: application
    platform: iOS
    sources:
      # 에셋 카탈로그·String Catalog·JSON은 파일 형식에 따라 Resources 단계로 자동 분류된다.
      - path: RememberSubway
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.evolvingark.remembersubway.app
        PRODUCT_NAME: RememberSubway
        PRODUCT_MODULE_NAME: RememberSubway
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: RememberSubway/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: GW3G2WPCXT
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
          PROVISIONING_PROFILE_SPECIFIER: ""
    entitlements:
      path: RememberSubway/RememberSubway.entitlements
      properties:
        com.apple.developer.game-center: true
  RememberSubwayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - RememberSubwayTests
    dependencies:
      - target: RememberSubway
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.evolvingark.remembersubway.tests
        DEVELOPMENT_TEAM: GW3G2WPCXT
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/RememberSubway.app/RememberSubway"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  RememberSubway:
    build:
      targets:
        RememberSubway: all
        RememberSubwayTests: [test]
    test:
      targets:
        - RememberSubwayTests
